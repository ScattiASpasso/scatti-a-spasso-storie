<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parco natura viva — Scatti a Spasso</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --surface: #111815;
    --surface-2: #18221d;
    --border: #1e3329;
    --text: #dcdcdc;
    --muted: #9eb3aa;
    --accent: #6ee7b7;
    --accent-bright: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    padding-bottom: 70px;
  }

  .site-header {
    padding: 26px 3% 14px 3%;
    width: 100%;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
  }
  .brand-block {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-logo {
    height: 68px;
    width: auto;
    object-fit: contain;
    border-radius: 50%;
    -webkit-mask-image: radial-gradient(circle, #000 62%, rgba(0, 0, 0, 0) 72%);
    mask-image: radial-gradient(circle, #000 62%, rgba(0, 0, 0, 0) 72%);
  }
  .brand-title {
    font-family: 'Cinzel', serif;
    font-size: 1.65rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
    background: linear-gradient(135deg, #b87c24 15%, #f3d58d 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(184, 124, 36, 0.25));
  }
  .brand-sub {
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #888;
  }
  .header-nav {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .header-nav a {
    color: #8a9992;
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 8px;
    transition: color 0.25s ease, text-shadow 0.25s ease;
  }
  .header-nav a:hover, .header-nav a.active {
    color: #ffffff;
    text-shadow: 0 0 12px rgba(52, 211, 153, 0.55);
  }
  .header-nav a.active {
    color: var(--accent);
    font-weight: 700;
  }
  .divider-line {
    width: 100%;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(34, 197, 94, 0.8), rgba(110, 231, 183, 0.75), transparent);
    box-shadow: 0 0 12px rgba(52, 211, 153, 0.28);
    margin: 16px 0 6px 0;
  }

  .page-wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 18px 4% 40px;
  }

  .diary-hero {
    background-color: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 26px;
    margin-bottom: 28px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
  }
  .diary-hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  .diary-date {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #4ade80;
    margin-bottom: 6px;
  }
  .diary-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.45rem, 3vw, 2.1rem);
    line-height: 1.22;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .diary-subtitle {
    color: #b4c2bc;
    font-size: 0.98rem;
  }
  .back-diaries-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    background-color: var(--surface-2);
    border: 1px solid rgba(52, 211, 153, 0.55);
    color: var(--accent);
    border-radius: 999px;
    padding: 8px 16px;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    transition: all 0.25s ease;
  }
  .back-diaries-btn:hover {
    border-color: var(--accent-bright);
    background-color: rgba(52, 211, 153, 0.14);
    color: #ffffff;
    box-shadow: 0 0 16px rgba(52, 211, 153, 0.35);
  }

  .local-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .btn-ui {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 11px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .btn-ui:hover {
    border-color: var(--accent-bright);
    color: #ffffff;
  }
  input[type="file"] { display: none; }

  .status-banner {
    margin-bottom: 18px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(52, 211, 153, 0.1);
    border: 1px solid rgba(52, 211, 153, 0.35);
    font-size: 0.84rem;
    color: #d1fae5;
    display: none;
  }
  .status-banner.show { display: block; }

  .diary-stream {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .photo-card {
    background-color: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
  }

  .photo-frame {
    position: relative;
    background-color: #090c0b;
    overflow: hidden;
  }

  .photo-frame img {
    width: 100%;
    height: auto;
    max-height: 78vh;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    background-color: #090c0b;
  }

  .bubble-btn {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 12;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.22s ease, filter 0.22s ease;
    filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.92)) drop-shadow(0 5px 12px rgba(0, 0, 0, 0.8));
  }
  .bubble-btn:hover svg {
    transform: rotate(45deg) scale(1.05);
    filter: drop-shadow(0 6px 16px rgba(110, 231, 183, 0.45));
  }
  .bubble-btn:active { transform: scale(0.96); }
  .bubble-btn.is-open svg { transform: rotate(180deg); }
  .bubble-btn svg { width: 100%; height: 100%; display: block; transition: transform 0.25s ease; }

  .note-panel {
    display: none;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background-color: #0e1512;
    color: #d8e5df;
    font-size: 0.94rem;
  }
  .note-panel.open { display: block; }
  .note-panel a { color: #7dd3fc; text-decoration: underline; }
  .note-close {
    margin-top: 10px;
    background: var(--surface-2);
    color: var(--accent);
    border: 1px solid rgba(52, 211, 153, 0.45);
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }
  .note-close:hover {
    background: rgba(52, 211, 153, 0.14);
    color: #ffffff;
  }

  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: rgba(12, 12, 12, 0.9);
    backdrop-filter: blur(6px);
    z-index: 900;
    text-align: center;
    padding: 12px 20px;
    color: #666;
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-top: 1px solid rgba(255, 255, 255, 0.04);
  }

  @media (max-width: 768px) {
    .brand-logo { height: 42px; }
    .brand-title { font-size: 1.3rem; letter-spacing: 2.5px; }
    .diary-hero { padding: 18px; }
    .bubble-btn { width: 42px; height: 42px; right: 12px; bottom: 12px; }
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <div class="brand-block">
        <div class="brand-row">
          <img src="../../foto/logo1.jpg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
          <div class="brand-title">Scatti a Spasso</div>
        </div>
        <div class="brand-sub">portfolio di stefano adami</div>
      </div>
      <nav class="header-nav">
        <a href="../../index.html">Home</a>
        <a href="../../storie.html" class="active">Diari</a>
      </nav>
    </div>
    <div class="divider-line"></div>
  </header>

  <div class="page-wrap">
    <section class="diary-hero">
      <div class="diary-hero-top">
        <div>
          <div class="diary-date" id="diaryDate">4 Giugno 2017</div>
          <h1 class="diary-title" id="diaryTitle">Parco natura viva</h1>
          <p class="diary-subtitle" id="diarySubtitle">Breve reportage di una giornata al Parco Natura Viva</p>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:10px;">
          <a href="../../storie.html" class="back-diaries-btn">← DIARI</a>
          <div class="local-controls">
            <label class="btn-ui">
              Carica JSON locale
              <input type="file" id="jsonPicker" accept=".json,application/json">
            </label>
            <label class="btn-ui">
              Collega cartella foto
              <input type="file" id="photoPicker" accept="image/*" multiple>
            </label>
          </div>
        </div>
      </div>
    </section>

    <div class="status-banner" id="statusBanner"></div>
    <main class="diary-stream" id="gallery"></main>
  </div>

  <footer>
    &copy; 2026 Scatti a Spasso — Stefano Adami
  </footer>

<script>
(() => {
  const JSON_URL = "04-06-17 Parco natura viva.json";
  const CLOSE_TEXT = "Chiudi";
  const IS_IT = true;

  const els = {
    diaryDate: document.getElementById("diaryDate"),
    diaryTitle: document.getElementById("diaryTitle"),
    diarySubtitle: document.getElementById("diarySubtitle"),
    gallery: document.getElementById("gallery"),
    statusBanner: document.getElementById("statusBanner"),
    jsonPicker: document.getElementById("jsonPicker"),
    photoPicker: document.getElementById("photoPicker")
  };

  const localPhotoUrls = new Map();
  let currentData = {
    titolo: "Parco natura viva",
    data: "4 Giugno 2017",
    sottotitolo: "Breve reportage di una giornata al Parco Natura Viva",
    foto: []
  };

  function showStatus(msg) {
    els.statusBanner.textContent = msg;
    els.statusBanner.classList.add("show");
  }

  function escapeHtmlAttr(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function bubbleSvg() {
    return `
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 5C12.95 5 4 12.84 4 22.5c0 4.23 1.72 8.11 4.58 11.14L6.4 42.2l9.1-3.36c2.65 1.07 5.51 1.66 8.5 1.66 11.05 0 20-7.84 20-17.5S35.05 5 24 5z" fill="rgba(17, 24, 21, 0.78)" stroke="#6ee7b7" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="17" cy="22.5" r="2" fill="#6ee7b7"/>
        <circle cx="24" cy="22.5" r="2" fill="#ffffff"/>
        <circle cx="31" cy="22.5" r="2" fill="#6ee7b7"/>
      </svg>`;
  }

  function resolveImageSrc(filename) {
    return localPhotoUrls.has(filename) ? localPhotoUrls.get(filename) : filename;
  }

  function renderGallery() {
    els.diaryTitle.textContent = currentData.titolo || "";
    els.diaryDate.textContent = currentData.data || "";
    els.diarySubtitle.textContent = currentData.sottotitolo || "";

    const photos = Array.isArray(currentData.foto) ? currentData.foto : [];
    els.gallery.innerHTML = "";

    if (photos.length === 0) {
      els.gallery.innerHTML = `
        <div class="diary-hero" style="text-align:center; color:var(--muted);">
          ${IS_IT
            ? "Nessuna foto nel JSON o apertura locale: usa «Carica JSON locale» e «Collega cartella foto»."
            : "No photos in JSON or local mode: use «Load local JSON» and «Link local photos»."}
        </div>`;
      return;
    }

    photos.forEach((item, idx) => {
      const file = item.file || "";
      const note = typeof item.nota === "string" ? item.nota.trim() : "";
      const hasNote = note.length > 0;
      const src = resolveImageSrc(file);

      const card = document.createElement("article");
      card.className = "photo-card";
      card.innerHTML = `
        <div class="photo-frame">
          <img src="${escapeHtmlAttr(src)}" alt="${escapeHtmlAttr(file)}" loading="lazy">
          ${hasNote ? `
            <button type="button" class="bubble-btn" aria-expanded="false" aria-label="${IS_IT ? "Apri nota" : "Open note"}" data-note-idx="${idx}">
              ${bubbleSvg()}
            </button>
          ` : ""}
        </div>
        ${hasNote ? `
          <div class="note-panel" id="note-${idx}" role="region">
            <div>${note}</div>
            <button type="button" class="note-close" data-close-idx="${idx}">${CLOSE_TEXT}</button>
          </div>
        ` : ""}
      `;
      els.gallery.appendChild(card);
    });
  }

  els.gallery.addEventListener("click", e => {
    const btn = e.target.closest("button[data-note-idx]");
    if (btn) {
      const idx = btn.dataset.noteIdx;
      const panel = document.getElementById(`note-${idx}`);
      if (!panel) return;
      const isOpen = panel.classList.contains("open");
      document.querySelectorAll(".note-panel.open").forEach(p => p.classList.remove("open"));
      document.querySelectorAll(".bubble-btn.is-open").forEach(b => {
        b.classList.remove("is-open");
        b.setAttribute("aria-expanded", "false");
      });
      if (!isOpen) {
        panel.classList.add("open");
        btn.classList.add("is-open");
        btn.setAttribute("aria-expanded", "true");
      }
      return;
    }

    const closeBtn = e.target.closest("button[data-close-idx]");
    if (closeBtn) {
      const idx = closeBtn.dataset.closeIdx;
      const panel = document.getElementById(`note-${idx}`);
      const btn = els.gallery.querySelector(`button[data-note-idx="${idx}"]`);
      if (panel) panel.classList.remove("open");
      if (btn) {
        btn.classList.remove("is-open");
        btn.setAttribute("aria-expanded", "false");
      }
    }
  });

  els.jsonPicker.addEventListener("change", async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      currentData = JSON.parse(await file.text());
      renderGallery();
      showStatus(IS_IT ? `Caricato: ${file.name}` : `Loaded: ${file.name}`);
    } catch (err) {
      showStatus((IS_IT ? "Errore JSON: " : "JSON error: ") + err.message);
    }
    e.target.value = "";
  });

  els.photoPicker.addEventListener("change", e => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    localPhotoUrls.forEach(u => URL.revokeObjectURL(u));
    localPhotoUrls.clear();
    files.forEach(f => localPhotoUrls.set(f.name, URL.createObjectURL(f)));
    renderGallery();
    showStatus(IS_IT ? `Collegate ${files.length} foto locali` : `Linked ${files.length} local photos`);
    e.target.value = "";
  });

  async function tryAutoLoadJson() {
    if (window.location.protocol === "file:") {
      showStatus(IS_IT
        ? "Apertura locale (file://): usa «Carica JSON locale» e «Collega cartella foto»."
        : "Local mode (file://): use «Load local JSON» and «Link local photos».");
      renderGallery();
      return;
    }
    try {
      const resp = await fetch(encodeURI(JSON_URL), { cache: "no-store" });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      currentData = await resp.json();
      renderGallery();
    } catch (_) {
      renderGallery();
    }
  }

  tryAutoLoadJson();
})();
</script>
</body>
</html>
